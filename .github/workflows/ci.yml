name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: Contract fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fixtures = sorted(Path("tests/fixtures/contracts").rglob("*.json"))
          if not fixtures:
              raise SystemExit("no contract fixtures found")
          for fixture in fixtures:
              with fixture.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"validated {len(fixtures)} contract fixtures")
          PY
      - name: Discovery accuracy corpus
        run: |
          python3 tests/fixtures/discovery/v0.1/generate_corpus.py --check
          cargo build --locked
          python3 tests/fixtures/discovery/v0.1/evaluate.py \
            --binary target/debug/taskattest \
            --corpus tests/fixtures/discovery/v0.1/corpus.json \
            --expected tests/fixtures/discovery/v0.1/metrics.json \
            --output "${RUNNER_TEMP}/taskattest-discovery-metrics.json"
      - name: Benchmark harness
        shell: bash
        run: |
          bash -n benchmarks/run.sh
          fixture="${RUNNER_TEMP}/taskattest-benchmark-smoke"
          python3 benchmarks/generate_workspace.py \
            --files 4 --checks 2 --output "${fixture}"
          test "$(git -C "${fixture}" ls-files | wc -l)" -eq 4
          test "$(grep -c '^\[\[checks\]\]$' "${fixture}/.taskattest.toml")" -eq 2
          test -z "$(git -C "${fixture}" status --porcelain)"
      - name: TaskAttest receipt dogfood
        run: cargo run --quiet --locked -- run --check contract-fixtures --check rust-format --check rust-lint --check rust-test --check rust-build --receipt-out "${RUNNER_TEMP}/taskattest-ci-receipt.json" --format json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskattest-ci-receipt
          path: ${{ runner.temp }}/taskattest-ci-receipt.json

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 \
            --locked --no-default-features
      - name: Audit Rust dependencies
        run: cargo +1.88.0 audit --deny warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
