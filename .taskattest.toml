version = 1

[[checks]]
id = "contract-fixtures"
label = "Contract fixture JSON"
kind = "test"
command = [
  "python3",
  "-c",
  "import json; from pathlib import Path; fixtures = sorted(Path('tests/fixtures/contracts').rglob('*.json')); assert fixtures, 'no contract fixtures found'; [json.loads(path.read_text(encoding='utf-8')) for path in fixtures]; print(f'validated {len(fixtures)} contract fixtures')",
]
working_directory = "."
reason = "versioned receipt fixtures and mutation manifests are public compatibility evidence"
coverage_paths = [
  "tests/fixtures/contracts/**",
  "tests/contract_compatibility.rs",
  ".taskattest.toml",
  ".github/workflows/**",
]
pass_environment = []
non_hermetic_inputs = ["installed Python interpreter"]
replaces_workflow_steps = [
  ".github/workflows/ci.yml#quality#Contract fixtures",
]

[[checks]]
id = "v1-evidence-tests"
label = "v1 evidence gate tests"
kind = "test"
command = [
  "python3",
  "-m",
  "unittest",
  "discover",
  "-s",
  "scripts/tests",
  "-p",
  "test_verify_v1_evidence.py",
]
working_directory = "."
reason = "the v1 evidence policy must be covered by executable regression tests"
coverage_paths = [
  "scripts/tests/test_verify_v1_evidence.py",
  "scripts/verify_v1_evidence.py",
  ".github/v1-evidence.json",
]
pass_environment = []
non_hermetic_inputs = ["installed Python interpreter"]
replaces_workflow_steps = [
  ".github/workflows/ci.yml#quality#v1 evidence gate tests",
]

[[checks]]
id = "v1-evidence-structure"
label = "v1 evidence structure"
kind = "test"
command = [
  "python3",
  "scripts/verify_v1_evidence.py",
  ".github/v1-evidence.json",
  "--check-structure",
]
working_directory = "."
reason = "the committed v1 evidence document must retain its required structure"
coverage_paths = [
  "scripts/verify_v1_evidence.py",
  ".github/v1-evidence.json",
]
pass_environment = []
non_hermetic_inputs = ["installed Python interpreter"]
replaces_workflow_steps = [
  ".github/workflows/ci.yml#quality#v1 evidence schema",
]
