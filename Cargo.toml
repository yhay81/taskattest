[package]
name = "taskattest"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Evidence-backed verification receipts for software changes"
repository = "https://github.com/yhay81/taskattest"
rust-version = "1.85"
readme = "README.md"
keywords = ["verification", "testing", "attestation", "receipt", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/INSTALL.md",
    "/CONCEPT.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/GOVERNANCE.md",
    "/ROADMAP.md",
    "/RELEASING.md",
    "/SUPPORT.md",
    "/ADOPTERS.md",
    "/FUZZING.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3.4"
globset = "0.4"
libc = "0.2"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.11"
shlex = "2.0"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
